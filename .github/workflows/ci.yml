name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightforge
          POSTGRES_PASSWORD: insightforge
          POSTGRES_DB: insightforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightforge"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IF_DATABASE_URL: postgresql+psycopg://insightforge:insightforge@localhost:5432/insightforge
      IF_TEST_DATABASE_URL: postgresql+psycopg://insightforge:insightforge@localhost:5432/insightforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Migrations must apply cleanly on real PostgreSQL and match the models (no drift).
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
