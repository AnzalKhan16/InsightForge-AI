name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Lint, Migrations & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightforge
          POSTGRES_PASSWORD: insightforge
          POSTGRES_DB: insightforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      IF_DATABASE_URL: postgresql+psycopg://insightforge:insightforge@localhost:5432/insightforge
      IF_TEST_DATABASE_URL: postgresql+psycopg://insightforge:insightforge@localhost:5432/insightforge
      IF_REDIS_URL: redis://localhost:6379/0
      IF_SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars
      IF_ENVIRONMENT: test
      IF_DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting (Ruff)
        run: ruff check .

      - name: Database Migration Idempotency & Drift Audit
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run Backend Pytest Suite
        run: pytest -v

  frontend-qa:
    name: Frontend Lint, Types & Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Static Typecheck & Linting
        run: npm run lint

      - name: Execute Vitest Component Test Suite
        run: npm test

      - name: Validate Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NODE_ENV: production

  docker-verification:
    name: Docker Build & Compose Verification
    needs: [backend-qa, frontend-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Schemas
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Verify Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: insightforge-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Verify Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          push: false
          tags: insightforge-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    name: Security Vulnerabilities & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection Scanner (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node.js High-Severity Dependency Audit
        run: |
          npm audit --prefix frontend --audit-level=high || true
