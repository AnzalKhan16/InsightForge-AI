services:
  backend:
    build: ../backend
    ports: ["8000:8000"]
    env_file: ../backend/.env.example
    environment:
      IF_CORS_ORIGINS: http://localhost:3000
  frontend:
    build: ../frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
# PostgreSQL, Redis and object storage are added in later phases.
