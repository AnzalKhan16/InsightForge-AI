services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightforge}
      POSTGRES_DB: ${POSTGRES_DB:-insightforge}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightforge} -d ${POSTGRES_DB:-insightforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - insightforge-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - insightforge-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      IF_CORS_ORIGINS: http://localhost:3000
      IF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insightforge}:${POSTGRES_PASSWORD:-insightforge}@db:5432/${POSTGRES_DB:-insightforge}
      IF_REDIS_URL: redis://redis:6379/0
      IF_STORAGE_BACKEND: local
      IF_STORAGE_LOCAL_DIR: /app/data/raw
    volumes:
      - storage_data:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - insightforge-net

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      IF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insightforge}:${POSTGRES_PASSWORD:-insightforge}@db:5432/${POSTGRES_DB:-insightforge}
      IF_REDIS_URL: redis://redis:6379/0
      IF_STORAGE_BACKEND: local
      IF_STORAGE_LOCAL_DIR: /app/data/raw
    volumes:
      - storage_data:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - insightforge-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - insightforge-net

volumes:
  pgdata:
  redisdata:
  storage_data:

networks:
  insightforge-net:
    driver: bridge
