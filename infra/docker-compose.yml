services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightforge
      POSTGRES_PASSWORD: insightforge
      POSTGRES_DB: insightforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ../backend
    ports: ["8000:8000"]
    env_file: ../backend/.env.example
    environment:
      IF_CORS_ORIGINS: http://localhost:3000
      IF_DATABASE_URL: postgresql+psycopg://insightforge:insightforge@db:5432/insightforge
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ../frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  pgdata:
# Redis and object storage (MinIO) are added in later phases.
